# CI: build + test on every PR; build and push images on merge to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # TODO: path filters so only changed services build (plan: keep pipeline fast)
      - name: Build and test
        run: mvn -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  docker-images:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC -> AWS, no stored keys
      contents: read
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      # TODO Phase 6: configure-aws-credentials with role-to-assume (OIDC),
      # login to ECR, push image tagged with the commit SHA, then deploy.
      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t shopflow/${{ matrix.service }}:${{ github.sha }} .
