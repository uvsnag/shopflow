server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - StripPrefix=2   # /api/v1/** -> /**
          routes:
            - id: auth-login-rate-limited
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    # NFR-05: 5 tries per minute per IP. replenishRate is tokens
                    # per SECOND, so each request costs 12 tokens: 60/12 = 5/min.
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 12
                    key-resolver: "#{@ipKeyResolver}"
            - id: auth
              uri: ${AUTH_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: products
              uri: ${PRODUCT_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**,/api/v1/admin/products/**
            - id: inventory
              uri: ${INVENTORY_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/admin/inventory/**,/api/v1/inventory/**
            - id: orders
              uri: ${ORDER_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/admin/orders/**
            - id: payments
              uri: ${PAYMENT_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/admin/payments/**
            - id: notifications
              uri: ${NOTIFICATION_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**

shopflow:
  jwks-url: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # NFR-20 p95 panels
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

---
# NFR-19: JSON logs when SPRING_PROFILES_ACTIVE=json-logs (compose / AWS)
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
