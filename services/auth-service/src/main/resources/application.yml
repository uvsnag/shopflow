server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: classpath:shopflow-defaults.yml   # Kafka, actuator, tracing, JSON logs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

shopflow:
  jwt:
    access-ttl: 15m   # FR-02
    refresh-ttl: 7d
    # NFR-07: PKCS#8 PEM from env / AWS Secrets Manager. Empty = generate a
    # throwaway dev key at startup (restarts then invalidate all tokens).
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
