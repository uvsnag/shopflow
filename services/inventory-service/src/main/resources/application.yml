server:
  port: 8083

spring:
  application:
    name: inventory-service
  config:
    import: classpath:shopflow-defaults.yml   # Kafka, actuator, tracing, JSON logs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/inventory_db
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: inventory-service

shopflow:
  # safety net only: order-service cancels unpaid orders after 15m (BR-03);
  # the reservation must outlive that so a last-second payment keeps its stock
  reservation-ttl: 30m
