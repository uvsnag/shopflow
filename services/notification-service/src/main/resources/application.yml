server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    import: classpath:shopflow-defaults.yml   # Kafka, actuator, tracing, JSON logs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}   # MailHog SMTP
  kafka:
    consumer:
      group-id: notification-service
