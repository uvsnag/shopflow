server:
  port: 8084

spring:
  application:
    name: order-service
  config:
    import: classpath:shopflow-defaults.yml   # Kafka, actuator, tracing, JSON logs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: order-service

shopflow:
  product-service-url: ${PRODUCT_URL:http://localhost:8082}
  payment-timeout: 15m   # BR-03
