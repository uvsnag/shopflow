server:
  port: 8085

spring:
  application:
    name: payment-service
  config:
    import: classpath:shopflow-defaults.yml   # Kafka, actuator, tracing, JSON logs
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    consumer:
      group-id: payment-service

shopflow:
  provider-url: ${PROVIDER_URL:http://localhost:9090}
  webhook-url: ${WEBHOOK_URL:http://localhost:8085/payments/webhook}
  webhook-secret: ${WEBHOOK_SECRET:local-dev-secret}   # NFR-07: env var, never in Git for real secrets
  refund-retry:
    poll-ms: 60000
    max-attempts: 5

# NFR-11: 3 attempts with backoff + circuit breaker (3s timeout is on the RestClient)
resilience4j:
  retry:
    instances:
      provider:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      provider:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
